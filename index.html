<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STL Slicer — слои для скульптуры</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <header>
    <h1>STL&nbsp;Slicer <span>слои для склейки скульптуры</span></h1>
    <label class="btn primary">Открыть STL<input id="file" type="file" accept=".stl" hidden /></label>
    <button id="demo" class="btn">Пример (утка)</button>
    <span class="spacer"></span>
    <label class="btn">Загрузить проект<input id="projectFile" type="file" accept=".json" hidden /></label>
    <button id="saveProject" class="btn">Сохранить проект</button>
  </header>

  <main>
    <aside id="panel"></aside>

    <section id="workspace">
      <nav class="tabs">
        <button data-tab="view3d" class="active">3D</button>
        <button data-tab="layer">Слой / направляющие</button>
        <button data-tab="sheets">Раскрой</button>
        <button data-tab="report">Отчёт</button>
        <span class="spacer"></span>
        <span id="status"></span>
      </nav>

      <div id="view3d" class="tab active">
        <div id="three"></div>
        <div class="overlay">
          <label><input type="checkbox" id="showModel" checked /> модель</label>
          <label><input type="checkbox" id="showLayers" checked /> слои</label>
          <label><input type="checkbox" id="showRods" checked /> направляющие</label>
          <label>разнести <input type="range" id="explode" min="1" max="4" step="0.1" value="1" /></label>
        </div>
      </div>

      <div id="layer" class="tab">
        <div class="layerbar">
          <button id="layerPrev" class="btn small">◀</button>
          <input type="range" id="layerSlider" min="1" max="1" value="1" />
          <button id="layerNext" class="btn small">▶</button>
          <span id="layerInfo"></span>
          <span class="spacer"></span>
          <span class="hint">Клик — добавить направляющую · перетаскивание — сдвинуть · ПКМ — удалить · колесо — масштаб</span>
        </div>
        <canvas id="layerCanvas"></canvas>
      </div>

      <div id="sheets" class="tab">
        <div id="sheetList"></div>
      </div>

      <div id="report" class="tab">
        <pre id="reportText"></pre>
      </div>

      <div id="warnings"></div>
    </section>
  </main>

  <div id="drop" hidden>Отпустите STL-файл</div>
  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
